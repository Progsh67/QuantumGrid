<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎈 Eshin's Balloon Pop Fun! 🎈</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #e0f2fe, #fef08a);
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 30px;
            border-radius: 50px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10;
            border: 4px solid #4ade80;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: #1e293b;
        }

        #score {
            color: #ec4899;
            font-weight: bold;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .balloon {
            position: absolute;
            width: 90px;
            height: 105px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            animation: floatUp 7s linear forwards; /* Made it a bit slower so it's easier to catch */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset -8px -8px 0px rgba(0,0,0,0.07);
        }

        .balloon::after {
            content: "▲";
            color: inherit;
            font-size: 14px;
            position: absolute;
            bottom: -8px;
            filter: brightness(0.9);
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh); }
            100% { transform: translateY(-15vh); }
        }

        .pop {
            animation: burst 0.15s ease-out forwards !important;
        }

        @keyframes burst {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* NEW: Giant, unmissable message box right in the center of the screen */
        #message-board {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #ffffff;
            border: 6px solid #ff477e;
            border-radius: 30px;
            padding: 20px 40px;
            font-size: 2.2rem;
            font-weight: bold;
            color: #1e3a8a;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            z-index: 100;
            pointer-events: none;
            width: 80%;
            max-width: 500px;
            opacity: 0;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Class to trigger the pop-up appearance */
        #message-board.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>🎈 Eshin's Score: <span id="score">0</span> 🎈</h1>
    </div>

    <div id="message-board">Hello Eshin!</div>

    <div id="game-container"></div>

    <script>
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const messageBoard = document.getElementById('message-board');
        let score = 0;
        let messageTimer = null;

        const colors = ['#ff0055', '#00ccff', '#9900ff', '#ffcc00', '#ff6600', '#33cc33'];

        const phrases = [
            "Eshin, you are good!",
            "Eshin, you are a good boy!",
            "Eshin, your Mummy's name is Niru!",
            "Your Daddy's name is Manobigyan Shreesh!",
            "Eshin, you are 3 years old!",
            "Good job, Eshin!",
            "Wow! Super Eshin!"
        ];

        function playPopSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
        }

        function speakPhrase(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.85; // Slightly slower and clearer for a toddler
                utterance.pitch = 1.2; 
                window.speechSynthesis.speak(utterance);
            }
        }

        // Displays the phrase proudly in the center box
        function displayMessage(text) {
            // Clear any old timer if he pops another balloon quickly
            clearTimeout(messageTimer);
            
            messageBoard.textContent = text;
            messageBoard.classList.add('show');
            
            // Hide the box automatically after 2 seconds
            messageTimer = setTimeout(() => {
                messageBoard.classList.remove('show');
            }, 2000);
        }

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');

            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomX = Math.random() * (window.innerWidth - 110);
            
            balloon.style.backgroundColor = randomColor;
            balloon.style.color = randomColor;
            balloon.style.left = `${randomX}px`;

            const duration = 6 + Math.random() * 3;
            balloon.style.animationDuration = `${duration}s`;

            const popEvent = (e) => {
                e.preventDefault();
                if (!balloon.classList.contains('pop')) {
                    balloon.classList.add('pop');
                    playPopSound();
                    
                    score++;
                    scoreDisplay.textContent = score;

                    const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
                    
                    // Fire off the screen pop-up and the voice speaking
                    displayMessage(randomPhrase);
                    speakPhrase(randomPhrase);
                    
                    setTimeout(() => { balloon.remove(); }, 150);
                }
            };

            balloon.addEventListener('mousedown', popEvent);
            balloon.addEventListener('touchstart', popEvent);
            balloon.addEventListener('animationend', () => { balloon.remove(); });

            container.appendChild(balloon);
        }

        // Spawn a new balloon every 1.6 seconds so it's not overwhelming
        setInterval(createBalloon, 1600);

        // Start with a few balloons on screen
        for(let i=0; i<3; i++) {
            setTimeout(createBalloon, i * 600);
        }
    </script>
</body>
</html>
