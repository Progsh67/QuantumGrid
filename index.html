<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎈 Balloon Pop Fun! 🎈</title>
    <style>
        /* Fun, kid-friendly styling */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #e0f2fe, #fef08a); /* Nice sky and sun gradient */
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Scoreboard */
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 30px;
            border-radius: 50px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10;
            border: 4px solid #4ade80;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: #1e293b;
        }

        #score {
            color: #ec4899;
            font-weight: bold;
        }

        /* The Game Canvas/Area */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Balloon styling */
        .balloon {
            position: absolute;
            width: 80px;
            height: 95px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            animation: floatUp 4s linear forwards;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset -8px -8px 0px rgba(0,0,0,0.07);
        }

        /* Little string at the bottom of the balloon */
        .balloon::after {
            content: "▲";
            color: inherit;
            font-size: 12px;
            position: absolute;
            bottom: -8px;
            filter: brightness(0.9);
        }

        /* Floating animation */
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(1);
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-15vh) scale(1);
                opacity: 0;
            }
        }

        /* Pop explosion effect */
        .pop {
            animation: burst 0.2s ease-out forwards !important;
        }

        @keyframes burst {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Balloons Popped: <span id="score">0</span> 🎈</h1>
    </div>

    <div id="game-container"></div>

    <script>
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        let score = 0;

        // Bright colors that toddlers love
        const colors = ['#ff0055', '#00ccff', '#9900ff', '#ffcc00', '#ff6600', '#33cc33'];

        // Sound generator so you don't need external files (Web Audio API)
        function playPopSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'sine';
            // Start high and sweep low quickly to make a fun "pop" noise
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');

            // Pick a random color and position
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomX = Math.random() * (window.innerWidth - 100);
            
            // Apply styles
            balloon.style.backgroundColor = randomColor;
            balloon.style.color = randomColor; // For the little string arrow
            balloon.style.left = `${randomX}px`;

            // Adjust speed slightly so it's not too fast for a 3-year-old
            const duration = 5 + Math.random() * 3; // 5 to 8 seconds
            balloon.style.animationDuration = `${duration}s`;

            // Click or Tap event
            const popEvent = (e) => {
                e.preventDefault(); // Prevents double tapping bugs on mobile/tablets
                if (!balloon.classList.contains('pop')) {
                    balloon.classList.add('pop');
                    playPopSound();
                    score++;
                    scoreDisplay.textContent = score;
                    
                    // Remove balloon element after animation finishes
                    setTimeout(() => {
                        balloon.remove();
                    }, 200);
                }
            };

            balloon.addEventListener('mousedown', popEvent);
            balloon.addEventListener('touchstart', popEvent);

            // Clean up balloons that float off-screen without being popped
            balloon.addEventListener('animationend', () => {
                balloon.remove();
            });

            container.appendChild(balloon);
        }

        // Spawn a new balloon every 1.2 seconds
        setInterval(createBalloon, 1200);

        // Spawn 3 right away when starting
        for(let i=0; i<3; i++) {
            setTimeout(createBalloon, i * 400);
        }
    </script>
</body>
</html>
